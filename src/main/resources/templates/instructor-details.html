<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Instructor Details</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .instructor-info { border: 1px solid #ccc; padding: 1rem; margin-bottom: 2rem; }
        h1 { color: #333; }
        h2 { color: #666; margin-top: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.75rem; text-align: left; }
        th { background: #f4f4f4; }
        .no-courses { color: #999; font-style: italic; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .main-nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .main-nav a { color: #0066cc; text-decoration: none; font-weight: 600; }
        .main-nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div th:insert="~{fragments/menu :: menu}"></div>

<div class="instructor-info">
    <h1 th:text="${instructor.name}"></h1>
    <p><strong>Email:</strong> <span th:text="${instructor.email}"></span></p>
</div>

<h2>Courses Taught</h2>
<div th:if="${#lists.isEmpty(courses)}" class="no-courses">
    This instructor is not assigned to any courses.
</div>
<div th:unless="${#lists.isEmpty(courses)}">
    <table>
        <thead>
        <tr>
            <th>Course Name</th>
            <th>Course Code</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td>
                <a th:href="@{/courses/view/{code}(code=${course.code()})}"
                   th:text="${course.name()}"></a>
            </td>
            <td th:text="${course.code()}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
