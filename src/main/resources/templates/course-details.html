<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Course Details</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .course-info { border: 1px solid #ccc; padding: 1rem; margin-bottom: 2rem; }
        h1 { color: #333; }
        h2 { color: #666; margin-top: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.75rem; text-align: left; }
        th { background: #f4f4f4; }
        .no-instructors { color: #999; font-style: italic; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .main-nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .main-nav a { color: #0066cc; text-decoration: none; font-weight: 600; }
        .main-nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div th:insert="fragments/menu :: menu"></div>

<div class="course-info">
    <h1 th:text="${course.name()}"></h1>
    <p><strong>Course Code:</strong> <span th:text="${course.code()}"></span></p>
    <p><strong>Length:</strong> <span th:text="${course.courseLengthWeeks()}"></span> weeks</p>
    <p><strong>Assessment:</strong> <span th:text="${course.assessmentType()}"></span></p>
    <p><strong>Campus:</strong> <span th:text="${course.campus()}"></span></p>
    <p><strong>Prerequisites:</strong> 
        <span th:if="${#lists.isEmpty(course.prerequisites())}">None</span>
        <span th:unless="${#lists.isEmpty(course.prerequisites())}" th:text="${#strings.listJoin(course.prerequisites(), ', ')}"></span>
    </p>
</div>

<h2>Instructors</h2>
<div th:if="${#lists.isEmpty(instructors)}" class="no-instructors">
    No instructors assigned to this course.
</div>
<div th:unless="${#lists.isEmpty(instructors)}">
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="instructor : ${instructors}">
            <td>
                <a th:href="@{/instructors/view/{email}(email=${instructor.email()})}"
                   th:text="${instructor.name()}"></a>
            </td>
            <td th:text="${instructor.email()}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
